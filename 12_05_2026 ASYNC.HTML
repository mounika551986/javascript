<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASYNCHRONOUS PROGRAMMING</title>
</head>
<body>
    <button id="jokeBtn">Get a Joke</button>
<p id="jokeDisplay">Click the button to see a joke!</p>

<div onmouseover="console.log('Parent Over!')" style="padding: 50px; background: lightgreen;">
  Parent Box
  <button onmouseover="console.log('Child Over!')">Button</button>
</div>

<div onmouseenter="console.log('Parent Entered!')" style="padding: 50px; background: lightblue;">
  Child Box
  <button onmouseenter="console.log('Child Entered!')">Button</button>
</div>

    <script src="./12_05_2026 ASYNC.JS"></script>
</body>
</html>
